version: '3.8'

services:
  # 1. Service PHP (Aplikasi Laravel)
  toko_php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: toko_rizky_app
    restart: unless-stopped
    # Kita set working directory ke /var/www agar lebih umum
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel-network
    # Environment untuk koneksi Database
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  # 2. Service Nginx (Web Server)
  nginx:
    image: nginx:alpine
    container_name: nginx-container-new
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      # MAPPING CONFIG: Pastikan file ini ada di folder .docker/nginx/
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-network
    depends_on:
      - toko_php

  # 3. Service Database (MySQL)
  db:
    image: mysql:8.0
    container_name: db-container-toko
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3307:3306"
    volumes:
      - dbdata_new:/var/lib/mysql
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  dbdata_new:
    driver: local
